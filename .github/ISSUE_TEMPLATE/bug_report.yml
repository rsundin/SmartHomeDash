name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste access tokens, passwords, addresses or pictures of your home you would not want public.**
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: SmartHomeDash version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Where do you open the dashboard?
      options: [Browser on a computer, Companion app on a tablet or phone, Browser on a tablet, Wall screen or kiosk]
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Settings → System → Logs, lines mentioning smarthomedash. Remove anything private.
      render: text
