name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # No ignores: the Marketplace catalog (hacs/default) requires a clean run.
          # The brands check finds custom_components/smarthomedash/brand/icon.png.

  frontend:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Read as ES modules: a plain `node --check` on a .js file lets some syntax errors through.
      - run: for f in $(find custom_components/smarthomedash/frontend -name '*.js'); do node --input-type=module --check < "$f" || { echo "Syntax error in $f"; exit 1; }; done

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The backend tests need only Python's standard library (3.12+, as on ubuntu-latest).
      # The system packages come from the Ubuntu mirrors, which sometimes fail to
      # resolve on the runners; try three times before giving up.
      - name: Install Playwright, Chromium and WebKit
        timeout-minutes: 15
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.14.0
          for i in 1 2 3; do
            npx playwright install --with-deps chromium webkit && exit 0
            echo "Install attempt $i failed; retrying in $((i * 20)) s"
            sleep $((i * 20))
            sudo apt-get update -q || true
          done
          exit 1
      # Lint has its own job; everything else, the WebKit run included, must be there.
      - run: tests/run.sh backend
      - run: tests/run.sh browser
      - run: tests/run.sh webkit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pipx install ruff==0.16.9
      - run: npm install --no-save --no-package-lock eslint@10.15.0 globals@17.14.0
      - run: tests/run.sh lint

  home-assistant:
    # The integration under Home Assistant itself (tests/ha): the newest version, and
    # the oldest one on which everything passes.
    name: Home Assistant ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: newest
            python: "3.14"
            requirements: tests/ha/requirements.txt
          - name: oldest
            python: "3.13"
            requirements: tests/ha/requirements-oldest.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: pip install -r ${{ matrix.requirements }}
      - run: pytest tests/ha

