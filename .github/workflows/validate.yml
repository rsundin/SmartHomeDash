name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The icon ships in custom_components/smarthomedash/brand/.
          ignore: brands

  frontend:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Read as ES modules: a plain `node --check` on a .js file lets some syntax errors through.
      - run: for f in $(find custom_components/smarthomedash/frontend -name '*.js'); do node --input-type=module --check < "$f" || { echo "Syntax error in $f"; exit 1; }; done

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The backend tests need only Python's standard library (3.12+, as on ubuntu-latest).
      # The system packages come from the Ubuntu mirrors, which sometimes fail to
      # resolve on the runners; try three times before giving up.
      - name: Install Playwright and Chromium
        timeout-minutes: 15
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $i failed; retrying in $((i * 20)) s"
            sleep $((i * 20))
            sudo apt-get update -q || true
          done
          exit 1
      - run: tests/run.sh
